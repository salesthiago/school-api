# Reverse proxy do nginx para o backend school-api (Node/pm2 escutando em
# 127.0.0.1:3000). O frontend Angular (school-web) é hospedado fora desta
# instância, então este site só expõe a API.
#
# Instalação:
#   sudo cp school-api.conf /etc/nginx/sites-available/school-api
#   sudo ln -s /etc/nginx/sites-available/school-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Depois de apontar o DNS para a instância, rode o certbot (veja
# backend/deploy/setup-server.sh, passo 4) — ele reescreve este arquivo para
# HTTPS automaticamente.

server {
    listen 80;
    listen [::]:80;
    server_name api.SEU-DOMINIO.com;  # troque pelo domínio real da API

    client_max_body_size 25m;  # ajuste conforme o tamanho de upload esperado

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
